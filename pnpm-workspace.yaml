allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# Transitive dev dependencies that resolved below their patched versions, each
# pinned to a floor rather than a version: caret ranges so the packages that
# pull them in keep getting their own updates, and so these entries can be
# dropped once those packages ask for the fixed versions themselves.
#
# All three are build-time only — browserslist and its data table come in
# through Babel and SVGR, fast-uri through commitlint's schema validator — so
# none of them is reachable from anything this app ships. The lockfile is still
# the thing being scanned, and holding the floor costs nothing.
overrides:
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  fast-uri: ^3.1.6
